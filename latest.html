<style>
:root{color-scheme:dark;--charcoal:#e9e6f0;--violet:#401aa5;--lavender:#ab97f8;--bg:#16131c;--card:#221f29;--muted:#b4adc2;--line:#342d45}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--charcoal);background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35)}
.pip{overflow:visible;width:64px;height:64px;margin:0 auto 16px;display:block}
@media (prefers-reduced-motion:no-preference){.pip{animation:hop 1s ease-in-out infinite}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}}
h1{font-size:20px;line-height:28px;margin:0 0 6px;color:#fff}
p{margin:0 0 22px;color:var(--muted);font-size:15px;line-height:22px}
a.btn{display:inline-flex;align-items:center;gap:8px;background:var(--lavender);color:#1b1430;text-decoration:none;font-weight:700;padding:11px 20px;border-radius:999px}
a.btn:hover{background:#c2b3fb}
a.btn:focus-visible{outline:2px solid var(--lavender);outline-offset:3px}
</style>
</head>
<body>
<main class="card">
  <svg class="pip" viewBox="-20 -20 40 40" aria-hidden="true">
    <g fill="#ab97f8" stroke="#ab97f8" stroke-width="5" stroke-linejoin="round"><rect x="-18" y="-7" width="36" height="14" rx="7"/><rect x="-7" y="-18" width="14" height="36" rx="7"/></g>
    <g fill="#ab97f8"><rect x="-18" y="-7" width="36" height="14" rx="7"/><rect x="-7" y="-18" width="14" height="36" rx="7"/></g>
    <circle cx="-4" cy="-2.5" r="2.4" fill="#333"/><circle cx="4" cy="-2.5" r="2.4" fill="#333"/>
    <path d="M-3 3 q3 3 6 0" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
  <h1>Taking you to my portfolio…</h1>
  <p>This page has moved. If nothing happens in a moment, use the button below.</p>
  <a class="btn" href="index.html">Go to my portfolio <span aria-hidden="true">→</span></a>
</main>
</body>
</html>
